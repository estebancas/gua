# Judges every push to main and every pull request. Each step fails with a
# message that says what to fix. Run the same checks locally: see CLAUDE.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs; every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: lint-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans the whole history, so it needs more than the default depth of 1.
          fetch-depth: 0

      - name: Set up Python (for hererocks)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Cache Lua 5.1 and rocks
        id: lua-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lua
          key: lua-${{ runner.os }}-${{ hashFiles('scripts/setup-dev.sh') }}

      - name: Install Lua 5.1, luacheck, busted, luacov
        if: steps.lua-cache.outputs.cache-hit != 'true'
        run: sh scripts/setup-dev.sh

      - name: Add Lua to PATH
        run: echo "$GITHUB_WORKSPACE/.lua/bin" >> "$GITHUB_PATH"

      - name: Lint (luacheck)
        run: luacheck . --no-color

      - name: Unit tests and coverage of Logic.lua (minimum 90%)
        run: sh scripts/test.sh -o utfTerminal

      - name: Forbidden API check
        if: ${{ !cancelled() }}
        run: lua scripts/check-forbidden-api.lua

      - name: TOC check
        if: ${{ !cancelled() }}
        run: lua scripts/check-toc.lua

      # Workflow and secret checks, the same as the standards repo's lint.yml.
      # Each tool is pinned: the action by SHA, the binaries by version and sha256.
      - name: Workflow security (zizmor)
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: v1.30.1
          # Fail the job on findings instead of uploading SARIF, which needs
          # `security-events: write`. Rules: .github/zizmor.yml.
          advanced-security: false
          annotations: true

      - name: Workflow syntax and shell (actionlint)
        if: ${{ !cancelled() }}
        run: |
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C "$RUNNER_TEMP" actionlint
          rm actionlint.tar.gz
          "$RUNNER_TEMP/actionlint" -color

      - name: Secrets in git history (gitleaks)
        if: ${{ !cancelled() }}
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
          # Only the checked-out commit's history, not every fetched ref.
          "$RUNNER_TEMP/gitleaks" git --verbose --redact --exit-code 1 --no-banner --log-opts="HEAD" .

  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # -d: build the zip but never upload. No secrets are passed to this job.
      - name: Build the zip (BigWigs packager, dry run)
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d

      - name: Check the zip against the allowlist
        run: sh scripts/check-package.sh

  # Informational, not a required check (decided on #49): reports whether the
  # PR is low-risk (the agent may merge it once every check is green) or risky
  # (the owner merges it). It runs the base branch's classifier with Lua from
  # the Ubuntu package, so no code from the PR runs. But a PR that edits this
  # workflow can change the job itself, so the verdict here is a guide only:
  # the agent's local merge wrapper, which runs origin/main's classifier, is
  # what enforces it. It also labels the PR risk:high (red) or risk:low (green),
  # which needs write access to PRs; nothing from the PR runs in this job.
  risk-gate:
    name: risk-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Lua 5.1 (Ubuntu package, not the PR's setup script)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lua5.1

      - name: Classify the PR
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base="$RUNNER_TEMP/base"
          mkdir -p "$base"
          # Use the base branch's classifier, so a PR can't edit it to call itself
          # safe, and so no code from the PR runs while this job can write labels.
          if ! git cat-file -e "$BASE_SHA:scripts/classify-risk.lua" 2>/dev/null; then
            echo "::error::The base branch has no scripts/classify-risk.lua."
            exit 2
          fi
          git archive "$BASE_SHA" scripts | tar -x -C "$base"
          from="the base branch"
          git diff --no-color --no-ext-diff --src-prefix=a/ --dst-prefix=b/ -M "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/pr.diff"
          code=0
          (cd "$base" && lua5.1 scripts/classify-risk.lua < "$RUNNER_TEMP/pr.diff") > "$RUNNER_TEMP/verdict.txt" || code=$?
          cat "$RUNNER_TEMP/verdict.txt"
          {
            echo "## Risk gate"
            echo
            echo "Classifier from $from. This is a guide, not the gate: a PR that edits \`.github/\` can change this job, and it is risky for that reason alone. The agent's local merge wrapper re-checks with \`origin/main\`'s classifier and merges only \`risk:low\` PRs; the owner merges the rest."
            echo
            echo '```'
            cat "$RUNNER_TEMP/verdict.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$code" in
            0) echo "::notice title=risk:low::Classified low-risk. The agent's merge wrapper re-checks before merging."
               echo "label=risk:low" >> "$GITHUB_OUTPUT" ;;
            1) echo "::warning title=risk:high::The owner merges this PR. Reasons are in the job summary."
               echo "label=risk:high" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      # Fork PRs get a read-only token, so they keep only the annotation.
      - name: Label the PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ steps.classify.outputs.label }}
        run: |
          case "$LABEL" in
            risk:low) stale=risk:high ;;
            risk:high) stale=risk:low ;;
            *) echo "::error::No verdict to label."; exit 1 ;;
          esac
          # A new push can change the verdict, so drop the old label first.
          gh api -X DELETE "repos/$REPO/issues/$PR/labels/$stale" --silent 2>/dev/null || true
          gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$LABEL" --silent
