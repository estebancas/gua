version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a bad or hijacked
    # release has time to be caught.
    cooldown:
      default-days: 7
    # PR titles follow the commit format (checked by pr-title.yml, issue #58):
    # this gives "🔧 chore: bump ...".
    commit-message:
      prefix: "🔧 chore"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
